plugins {
    id 'java'
    id 'war'
    id 'org.hidetake.ssh' version '2.11.2'
}

group = 'Group36'
version = '1.0-SNAPSHOT'

base {
    archivesName = 'NongSanFarmily'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
    testImplementation 'com.h2database:h2:2.2.224'
    testImplementation 'org.mockito:mockito-core:5.11.0'

    implementation 'org.jdbi:jdbi3-core:3.48.0'
    implementation 'com.mysql:mysql-connector-j:9.3.0'
    implementation 'com.google.protobuf:protobuf-java:4.28.2'
    implementation 'com.google.code.gson:gson:2.12.1'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.apache.httpcomponents:fluent-hc:4.5.14'

    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'
    compileOnly 'jakarta.servlet.jsp:jakarta.servlet.jsp-api:3.1.1'
    compileOnly 'jakarta.el:jakarta.el-api:5.0.1'

    implementation 'org.slf4j:slf4j-simple:2.0.16'
    implementation 'com.resend:resend-java:3.1.0'
    implementation 'com.cloudinary:cloudinary-http5:2.3.0'
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.test {
    useJUnitPlatform()
}

tasks.war {
    archiveFileName = 'ROOT.war'
}

def configProps = new Properties()
def configFile = file("src/main/resources/config.properties")
if (configFile.exists()) {
    configProps.load(new FileInputStream(configFile))
}

remotes {
    host {
        host = configProps.getProperty('deploy.host') ?: ''
        user = configProps.getProperty('deploy.user') ?: ''
        password = configProps.getProperty('deploy.password') ?: ''
    }
}

ssh.settings {
    knownHosts = allowAnyHosts
}

task docker_app_start {
    doLast {
        println 'begin docker_app_start'
        ssh.run {
            session(remotes.host) {
                execute 'docker stop tomcat9', ignoreError: true
                execute 'docker rm tomcat9', ignoreError: true
                execute 'docker run -d --name tomcat9 -e TZ=Asia/Ho_Chi_Minh --add-host localhost:172.17.0.1 -v /usr/deploy:/usr/local/tomcat/webapps -p 80:8080 tomcat:10.1'
            }
        }
    }
}

task docker_upload_file_to_server {
    doLast {
        println 'begin docker_upload_file_to_server'
        ssh.run {
            session(remotes.host) {
                execute 'rm -rf /usr/deploy/ROOT.war /usr/deploy/ROOT'
                put from: "${project.projectDir}/build/libs/ROOT.war",
                        into: "/usr/deploy/ROOT.war"
            }
        }
    }
}

task docker_deploy {
    docker_deploy.dependsOn docker_app_start
    docker_deploy.dependsOn docker_upload_file_to_server
    docker_deploy.dependsOn build
    tasks.getByName('docker_app_start').mustRunAfter docker_upload_file_to_server
}

task checkDb {
    doLast {
        ssh.run {
            session(remotes.host) {
                def result = execute 'docker exec -i mysql mysql -uroot -p123 farmily -e "SELECT * FROM orders;"'
                println result
            }
        }
    }
}


